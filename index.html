<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEN Modern Calculator</title>
  <!-- Link to the stylesheet that makes everything look nice -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1 class="title">GEN <span>Modern Calculator</span></h1>

  <div class="calculator">
    <!-- The display area shows the current and previous values -->
    <div class="display">
      <div class="display-previous" id="previous-display"></div>
      <div class="display-current" id="current-display">0</div>
    </div>

    <!-- All the calculator buttons live in this grid -->
    <div class="buttons">
      <!-- Row 1: clear, delete, percent, divide -->
      <button class="btn function" data-action="clear">AC</button>
      <button class="btn function" data-action="delete">DEL</button>
      <button class="btn function" data-action="percent">%</button>
      <button class="btn operator" data-action="divide">÷</button>

      <!-- Row 2: 7, 8, 9, multiply -->
      <button class="btn number" data-number="7">7</button>
      <button class="btn number" data-number="8">8</button>
      <button class="btn number" data-number="9">9</button>
      <button class="btn operator" data-action="multiply">×</button>

      <!-- Row 3: 4, 5, 6, subtract -->
      <button class="btn number" data-number="4">4</button>
      <button class="btn number" data-number="5">5</button>
      <button class="btn number" data-number="6">6</button>
      <button class="btn operator" data-action="subtract">-</button>

      <!-- Row 4: 1, 2, 3, add -->
      <button class="btn number" data-number="1">1</button>
      <button class="btn number" data-number="2">2</button>
      <button class="btn number" data-number="3">3</button>
      <button class="btn operator" data-action="add">+</button>

      <!-- Row 5: sign toggle, 0, decimal, equals -->
      <button class="btn function" data-action="sign">+/-</button>
      <button class="btn number" data-number="0">0</button>
      <button class="btn function" data-action="decimal">.</button>
      <button class="btn operator" data-action="equals">=</button>
    </div>
  </div>

  <!-- Link to the JavaScript that makes the calculator work -->
  <script src="script.js"></script>
</body>
</html>
